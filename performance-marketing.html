<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Performance Marketing Works</title>

<link rel="stylesheet" href="style.css">

<style>

/* ========================= */
/* PAGE STYLE */
/* ========================= */

body{

    margin:0;
    padding:0;

    background:#000;

    font-family:Arial, sans-serif;
}

/* ========================= */
/* TITLE */
/* ========================= */

.page-title{

    text-align:center;

    color:#fff;

    font-size:3rem;

    margin-top:50px;

    margin-bottom:50px;
}

.page-title span{

    color:#d4af37;
}

/* ========================= */
/* GALLERY */
/* ========================= */

.gallery-container{

    width:90%;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(350px,1fr));

    gap:30px;

    padding-bottom:60px;
}

/* ========================= */
/* IMAGE CARD */
/* ========================= */

.gallery-card{

    background:#111;

    border-radius:20px;

    overflow:hidden;

    border:1px solid rgba(212,175,55,0.2);

    transition:0.4s ease;

    box-shadow:
    0 0 15px rgba(212,175,55,0.15);
}

.gallery-card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 25px rgba(212,175,55,0.5);
}

/* ========================= */
/* SAME SIZE IMAGES */
/* ========================= */

.gallery-card img{

    width:100%;

    height:280px;

    object-fit:cover;

    display:block;
}

</style>

</head>

<body>

<h1 class="page-title">

Performance
<span>Marketing Works</span>

</h1>

<div class="gallery-container">

    <div class="gallery-card">
        <img src="./assets/p1.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p2.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p3.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p4.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p5.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p6.png" alt="">
    </div>

    <div class="gallery-card">
        <img src="./assets/p8.png" alt="">
    </div>

</div>

</body>

</html>
